name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Pin to 24.04: the 26.04 image ships an enforcing AppArmor profile for
    # /usr/bin/tshark that only allows reads under /tmp, so tshark cannot open
    # the fixtures in tests/data (see PyPCAPKit issue #2019).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tshark
        run: |
          sudo debconf-set-selections <<< "wireshark-common wireshark-common/install-setuid boolean false"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark -v | head -2
      - name: Install Fnet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Byte-compile
        # -W error::SyntaxWarning 让 ``\=`` 这类无效转义直接失败，
        # 避免 Python 3.12+ 才暴露的隐性语法问题。
        run: python -W error::SyntaxWarning -m compileall -q fnet scripts
      - name: JavaScript syntax check
        run: node --check fnet/webui/static/app.js
      - name: Repo invariants (version sync / stdlib-only / import smoke)
        run: python -m unittest tests.test_hygiene -v
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows smoke
    # pyproject declares Windows support; this job is a blocking gate that
    # keeps subprocess calls argument-array/shell-free on Windows (see
    # AGENTS.md).  Chocolatey + Wireshark installs can be slow, so give the
    # job its own 30-minute timeout instead of relying on the default.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tshark
        shell: pwsh
        run: |
          choco install -y wireshark --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files\Wireshark"
      - name: Install Fnet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Doctor
        run: python -m fnet --doctor
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fnet:ci .
      - name: Smoke test image
        run: |
          docker run -d --name fnet-ci -p 127.0.0.1:18765:8765 fnet:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/api/health; then exit 0; fi
            sleep 1
          done
          docker logs fnet-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f fnet-ci || true

  image:
    name: Publish image to GHCR
    # Multi-arch (amd64/arm64) image pushed to GHCR on tags and manual runs.
    # The WebUI inside the container still binds loopback by default; see the
    # Dockerfile comments.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
