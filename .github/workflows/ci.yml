name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    # Pin to 24.04: the 26.04 image ships an enforcing AppArmor profile for
    # /usr/bin/tshark that only allows reads under /tmp, so tshark cannot open
    # the fixtures in tests/data (see PyPCAPKit issue #2019).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tshark
        run: |
          sudo debconf-set-selections <<< "wireshark-common wireshark-common/install-setuid boolean false"
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark -v | head -2
      - name: Install Fnet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Byte-compile
        run: python -m compileall -q fnet scripts
      - name: JavaScript syntax check
        run: node --check fnet/webui/static/app.js
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fnet:ci .
      - name: Smoke test image
        run: |
          docker run -d --name fnet-ci -p 127.0.0.1:18765:8765 fnet:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/api/health; then exit 0; fi
            sleep 1
          done
          docker logs fnet-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f fnet-ci || true
